name: GitLab Daily Backup

on:
  # Hər push-da avtomatik backup
  push:
    branches:
      - main
      - master
      - develop
      - production
  
  # Hər gün saat 03:00 UTC
  schedule:
    - cron: '0 3 * * *'
  
  # Manual trigger
  workflow_dispatch:

jobs:
  backup-to-gitlab:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Bütün git tarixini götür
          
      - name: Configure Git
        run: |
          git config --global user.name "GitHub Backup Bot"
          git config --global user.email "backup@github.com"
      
      - name: Push to GitLab Mirror
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_USERNAME: ${{ secrets.GITLAB_USERNAME }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          # GitLab remote URL
          GITLAB_URL="https://oauth2:${GITLAB_TOKEN}@gitlab.com/${GITLAB_USERNAME}/FitxLink-Backup/${REPO_NAME}.git"
          
          # Remote əlavə et (əgər yoxdursa)
          git remote add gitlab $GITLAB_URL 2>/dev/null || git remote set-url gitlab $GITLAB_URL
          
          # Bütün branch-ları push et
          echo "📤 Pushing all branches..."
          git push gitlab --all --force
          
          # Bütün tag-ları push et
          echo "🏷️  Pushing all tags..."
          git push gitlab --tags --force
          
          echo "✅ Backup completed successfully!"
          
      - name: Backup Summary
        if: always()
        run: |
          echo "🔄 Backup Summary"
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Time: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          
      - name: Notify on Failure
        if: failure()
        run: |
          echo "❌ Backup failed for ${{ github.repository }}"
          echo "Please check workflow logs"
