name: GitLab Daily Backup

on:
  push:
    branches: [main, master, develop]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  backup-to-gitlab:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          
      - name: Configure Git
        run: |
          git config --global user.name "GitHub Backup Bot"
          git config --global user.email "backup@github.com"
    
      - name: Create GitLab Repo if Not Exists
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          REPO_NAME: ${{ github.event.repository.name }}
          GITLAB_GROUP: "fitxlink-backup"
        run: |
          echo "🔍 Checking if GitLab repo exists..."
          
          SAFE_REPO_NAME="${REPO_NAME}"
          if [[ "$SAFE_REPO_NAME" == .* ]]; then
            SAFE_REPO_NAME="github-${SAFE_REPO_NAME#.}"
          fi
          
          echo "📝 Safe repo name: ${SAFE_REPO_NAME}"
          
          PROJECT_PATH="${GITLAB_GROUP}%2F${SAFE_REPO_NAME}"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
            "https://gitlab.com/api/v4/projects/${PROJECT_PATH}")
          
          if [ $STATUS -eq 404 ]; then
            echo "📦 Creating repository..."
            
            GROUP_ID=$(curl -s --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
              "https://gitlab.com/api/v4/groups?search=${GITLAB_GROUP}" | \
              jq -r '.[0].id')
            
            if [ "$GROUP_ID" = "null" ]; then
              echo "❌ Group not found!"
              exit 1
            fi
            
            curl -s --request POST \
              --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
              --header "Content-Type: application/json" \
              --data "{
                \"name\": \"${SAFE_REPO_NAME}\",
                \"path\": \"${SAFE_REPO_NAME}\",
                \"namespace_id\": ${GROUP_ID},
                \"visibility\": \"private\"
              }" \
              "https://gitlab.com/api/v4/projects" > /dev/null
            
            sleep 2
            echo "✅ Repository created"
          else
            echo "✅ Repository exists"
          fi
          
          echo "SAFE_REPO_NAME=${SAFE_REPO_NAME}" >> $GITHUB_ENV
      
      - name: Push to GitLab Mirror
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_GROUP: "fitxlink-backup"
        run: |
          GITLAB_URL="https://oauth2:${GITLAB_TOKEN}@gitlab.com/${GITLAB_GROUP}/${SAFE_REPO_NAME}.git"
          
          git remote remove gitlab 2>/dev/null || true
          git remote add gitlab $GITLAB_URL
          
          echo "📤 Pushing all refs to GitLab..."
          
          # Bütün remote branch-ları birbaşa push et
          git push gitlab "refs/remotes/origin/*:refs/heads/*" --force || echo "⚠️  Some refs failed"
          
          # Tag-ları push et
          git push gitla
