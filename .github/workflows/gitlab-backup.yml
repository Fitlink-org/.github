name: GitLab Daily Backup

on:
  push:
    branches: [main, master, develop]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  backup-to-gitlab:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Configure Git
        run: |
          git config --global user.name "GitHub Backup Bot"
          git config --global user.email "backup@github.com"
    
      - name: Create GitLab Repo if Not Exists
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          REPO_NAME: ${{ github.event.repository.name }}
          GITLAB_GROUP: "fitxlink-backup"
        run: |
          SAFE_REPO_NAME="${REPO_NAME}"
          if [[ "$SAFE_REPO_NAME" == .* ]]; then
            SAFE_REPO_NAME="github-${SAFE_REPO_NAME#.}"
          fi
          
          PROJECT_PATH="${GITLAB_GROUP}%2F${SAFE_REPO_NAME}"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
            "https://gitlab.com/api/v4/projects/${PROJECT_PATH}")
          
          if [ $STATUS -eq 404 ]; then
            GROUP_ID=$(curl -s --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
              "https://gitlab.com/api/v4/groups?search=${GITLAB_GROUP}" | jq -r '.[0].id')
            
            if [ "$GROUP_ID" != "null" ]; then
              curl -s --request POST \
                --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
                --header "Content-Type: application/json" \
                --data "{\"name\":\"${SAFE_REPO_NAME}\",\"path\":\"${SAFE_REPO_NAME}\",\"namespace_id\":${GROUP_ID},\"visibility\":\"private\"}" \
                "https://gitlab.com/api/v4/projects" > /dev/null
              sleep 2
            fi
          fi
          
          echo "SAFE_REPO_NAME=${SAFE_REPO_NAME}" >> $GITHUB_ENV
      
      - name: Push to GitLab Mirror
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_GROUP: "fitxlink-backup"
        run: |
          REPO_URL="https://oauth2:${GITLAB_TOKEN}@gitlab.com/${GITLAB_GROUP}/${SAFE_REPO_NAME}.git"
          
          git remote remove gitlab 2>/dev/null || true
          git remote add gitlab "${REPO_URL}"
          
          echo "📤 Pushing all branches..."
          git push gitlab 'refs/remotes/origin/*:refs/heads/*' --force || true
          
          echo "🏷️  Pushing tags..."
          git push gitlab --tags --force || echo "No tags to push"
          
          echo "✅ Backup completed!"
          
      - name: Verify Backup
        if: success()
        run: |
          echo "✅ GitLab Backup Summary"
          echo "Repository: ${{ github.repository }}"
          echo "GitLab URL: https://gitlab.com/${GITLAB_GROUP}/${SAFE_REPO_NAME}"
          echo "Time: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
